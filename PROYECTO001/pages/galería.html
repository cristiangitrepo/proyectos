<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería</title>
    <style>
        .galeria {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        .galeria img {
            width: 100px;
            height: 80px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <main>
        <h1>Galería de imágenes</h1>
        <section class="galeria">
            <article>
                <h2>Imágenes a distintas dimensiones</h2>
                <p>Galería de imágenes con diferentes dimensiones y con enlaces externos.</p>
                <a href="../assets/img/Masks (1).png" target="_blank">
                    <figure><img src="../assets/img/Masks (1).png" alt="Imagen de una chica pensando">
                        <figcaption>
                            <p>Imagen de una chica pensando</p>
                        </figcaption>
                    </figure>
                </a>
                <a href="../assets/img/Masks (2).png" target="_blank">
                    <figure><img src="../assets/img/Masks (2).png" alt="Imagen de una chica meditando">
                        <figcaption>
                            <p>Imagen de una chica meditando</p>
                        </figcaption>
                    </figure>
                </a>
                <a href="../assets/img/Masks (3).png" target="_blank">
                    <figure><img src="../assets/img/Masks (3).png" alt="Imagen de una chica mirando al cielo">
                        <figcaption>
                            <p>Imagen de una chica mirando al cielo</p>
                        </figcaption>
                    </figure>
                </a>
                <a href="../assets/img/Masks (4).png" target="_blank">
                    <figure><img src="../assets/img/Masks (4).png" alt="Imagen de una chica doblada">
                        <figcaption>
                            <p>Imagen de una chica doblada</p>
                        </figcaption>
                    </figure>
                </a>
            </article>
        </section>
    </main>
</body>

</html>
