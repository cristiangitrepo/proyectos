<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f9f4;
            background-image: url('../assets/img/fondo.png');
            background-repeat: no-repeat;
            background-size: 100% auto;
            background-position: center bottom;
        }

        .image-gallery {
            list-style: none;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
        }

        .image-gallery li {
            margin: 10px 10px;
        }

        .image-gallery img {
            max-width: 180px;
            height: auto;
        }

        .logo {
            display: block;
            margin: 0 auto;
            max-width: 200px;
            height: auto;
        }

        .description {
            font-size: 1.1rem;
            text-align: justify;
            color: white;
            margin-bottom: 1rem;
            margin-top: 1rem;
            background-color: #6c9894;
            padding: 70px 50px 0px 150px;
            height: 150px;
        }

        .title {
            font-size: 2rem;
            margin-bottom: 1rem;
            text-align: center;
            color: #6c9894;
        }
    </style>
</head>

<body>
    <header>
        <h1 style="display: none;">Imágenes</h1>
        <a href="https://www.yoga.com" target="_blank">
            <figure>
                <img class="logo" src="../assets/img/logo.png" alt="Imagen de yoga">
            </figure>
        </a>
    </header>
    <main>
        <article>
            <h2 class="title">EL YOGA Y LA SALUD</h2>
            <p class="description">El yoga es una práctica que combina posturas físicas, respiración y meditación
                para promover la salud
                y el bienestar. A continuación se presentan algunas imágenes relacionadas con el yoga:</p>
            <ul class="image-gallery">
                <li><a href="../assets/img/Masks1.png" target="_blank"><img src="../assets/img/Masks1.png"
                            alt="Chica en posición de meditación desde cerca"></a></li>
                <li><a href="../assets/img/Masks2.png" target="_blank"><img src="../assets/img/Masks2.png"
                            alt="Chica en posición de meditación desde lejos"></a></li>
                <li><a href="../assets/img/Masks3.png" target="_blank"><img src="../assets/img/Masks3.png"
                            alt="Chica en posición de yoga"></a></li>
                <li><a href="../assets/img/Masks4.png" target="_blank"><img src="../assets/img/Masks4.png"
                            alt="Chica en posición de yoga hacia adelante"></a></li>
                <li><a href="../assets/img/Masks5.png" target="_blank"><img src="../assets/img/Masks5.png"
                            alt="Chica en posición de yoga hacia atrás"></a></li>
                <li><a href="../assets/img/flor.png" target="_blank"><img src="../assets/img/flor.png"
                            alt="Chica en posición de yoga hacia atrás"></a></li>
            </ul>

        </article>
    </main>
    <footer>
        <p style="text-align: center; color: rgb(117, 117, 117)">&copy; 2023 Mi Proyecto. Todos los derechos reservados.
        </p>
    </footer>
</body>

</html>
